<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>克朗棋 (單機對戰版)</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background-color: #2c3e50; display: flex; justify-content: center; align-items: center; height: 100vh; color: #ecf0f1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; touch-action: none; }
        canvas { box-shadow: 0 15px 30px rgba(0,0,0,0.6); border-radius: 8px; }
        #ui { position: absolute; top: 20px; left: 20px; background: rgba(0,0,0,0.7); padding: 20px; border-radius: 12px; pointer-events: none; border: 1px solid rgba(255,255,255,0.1); }
        #ui h3 { margin: 0 0 10px 0; color: #f1c40f; }
        #ui p { margin: 5px 0; font-size: 14px; color: #bdc3c7; }
        
        #turn-indicator { font-size: 18px; font-weight: bold; margin-bottom: 15px !important; color: #2ecc71; }

        /* 右側計分板樣式 */
        #scoreboard { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.7); padding: 15px 20px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 15px; pointer-events: none; }
        .score-item { display: flex; align-items: center; gap: 12px; font-size: 20px; font-weight: bold; }
        .piece-icon { width: 24px; height: 24px; border-radius: 50%; position: relative; }
        .piece-icon::after { content: ''; position: absolute; top: 3px; left: 3px; right: 3px; bottom: 3px; border-radius: 50%; border: 1px solid rgba(0,0,0,0.2); }
        .piece-icon::before { content: ''; position: absolute; top: 3px; left: 3px; width: 8px; height: 8px; border-radius: 50%; border-top: 2px solid rgba(255,255,255,0.4); border-left: 2px solid rgba(255,255,255,0.4); transform: rotate(-15deg); }
        .black-icon { background-color: #2c3e50; border: 1px solid #95a5a6; }
        .white-icon { background-color: #ecf0f1; border: 1px solid #95a5a6; color: #2c3e50; }
    </style>
</head>
<body>
    <div id="ui">
        <h3>克朗棋 (單機對戰版)</h3>
        <p id="turn-indicator">現在輪到：玩家 1 (下方，黑棋)</p>
        <p>拖曳擊打紅色打擊子 (Striker)</p>
        <p>點擊底線空白處可平移紅球</p>
    </div>

    <div id="scoreboard">
        <div class="score-item">
            <div class="piece-icon black-icon"></div>
            <span id="black-count">x 9</span>
        </div>
        <div class="score-item">
            <div class="piece-icon white-icon"></div>
            <span id="white-count">x 9</span>
        </div>
    </div>
    <div id="error-toast" style="display: none; position: absolute; top: 80px; left: 50%; transform: translateX(-50%); background-color: #e74c3c; color: white; padding: 15px 25px; border-radius: 8px; font-weight: bold; z-index: 9999; box-shadow: 0 4px 10px rgba(0,0,0,0.5); text-align: center; max-width: 80%;">
        錯誤訊息
    </div>
    
    <script src="/socket.io/socket.io.js"></script> <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="game.js"></script>    
</body>
</html>
