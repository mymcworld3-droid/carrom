<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>豹豹碰碰大作戰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu-layer">
        <div class="menu-content">
            <h1 class="glow-title">豹豹碰碰大作戰</h1>
            <p class="subtitle">LEOPARD BATTLE ARENA</p>
            <div class="menu-buttons">
                <button class="btn" onclick="startGame('single')">
                    <span class="btn-icon">👤</span> 單人挑戰 (VS AI)
                </button>
                <button class="btn" onclick="startGame('local')">
                    <span class="btn-icon">👥</span> 雙人對決 (同機)
                </button>
                <button class="btn online" onclick="startGame('online')">
                    <span class="btn-icon">🌐</span> 連線大戰 (Socket.io)
                </button>
            </div>
            <div class="footer-hint">建議使用行動裝置或滑鼠拖曳進行遊戲</div>
        </div>
    </div>

    <div id="game-layer" style="display: none;">
        <div id="score-container">
            <div id="blue-score-dots" class="dots-group"></div>
            <div id="game-title">豹豹大作戰</div>
            <div id="red-score-dots" class="dots-group"></div>
        </div>

        <div id="game-container">
            <div id="ui-layer">
                <div class="stats">
                    <span id="turn-display">目前回合：藍隊 (玩家)</span>
                    <span id="instruction">請拉動豹豹進行彈射</span>
                    <span id="action-damage-text"></span>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
