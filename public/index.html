<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>豹豹碰碰大作戰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stats">
                <span id="turn-display">目前回合：藍隊 (玩家)</span>
                <span id="instruction">請拉動豹豹進行彈射（已禁用雙擊放大）</span>
            </div>
            <div id="score-board">
                <div class="team blue">藍隊剩餘: <span id="blue-count">3</span></div>
                <div class="team red">紅隊剩餘: <span id="red-count">3</span></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
