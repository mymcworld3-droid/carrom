<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.15.0/dist/tf.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>豹豹碰碰大作戰 - 英雄崛起</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="menu-layer">
        <div class="menu-content">
            <h1 class="glow-title">豹豹碰碰大作戰</h1>
            <p class="subtitle">LEOPARD BATTLE ARENA</p>
            <div class="menu-buttons">
                <button class="btn" onclick="enterSelection('single')">
                    <span class="btn-icon">👤</span> 單人挑戰 (VS AI)
                </button>
                <button class="btn" onclick="enterSelection('local')">
                    <span class="btn-icon">👥</span> 雙人對決 (同機)
                </button>
                <button class="btn online" onclick="enterSelection('online')">
                    <span class="btn-icon">🌐</span> 連線大戰 (Socket.io)
                </button>
                <button id="ai-train-btn" class="btn" style="border-color: #ffcc00; color: #ffcc00;" onclick="toggleTrainingUI()">
                    <span class="btn-icon">🧠</span> AI 強化訓練 (PPO)
                </button>
            </div>
            <div class="footer-hint">建議使用行動裝置或滑鼠拖曳進行遊戲</div>
        </div>
    </div>

    <div id="selection-layer" style="display: none;">
        <div class="selection-content">
            <div id="room-section">
                <h2 class="glow-title" style="font-size: 32px;">連線房間列表</h2>
                <div id="room-list-container"></div>
                <div class="menu-buttons" style="margin-top: 20px;">
                    <button class="btn" onclick="createRoom()">➕ 創建新房間</button>
                    <button class="btn" style="border-color: #555;" onclick="location.reload()">🏠 返回主選單</button>
                </div>
            </div>
    
            <div id="leopard-selection-section" style="display: none;">
                <div class="lobby-layout">
                    <div class="selection-box">
                        <h2 id="selection-title">請配置隊伍</h2>
                        <div class="type-container" id="type-list"></div>
                    </div>
    
                    <div class="status-panel">
                        <div class="panel-section">
                            <h3>我的隊伍 <button class="reset-link" onclick="resetSelection()">[重選]</button></h3>
                            <div id="current-selection" class="preview-dots"></div>
                        </div>
                        <div class="panel-section">
                            <h3>對手隊伍</h3>
                            <div id="opponent-selection-preview" class="preview-dots"></div>
                            <div id="opponent-status-hint" style="color: #4ecca3; font-size: 12px;">等待對手加入...</div>
                        </div>
                        <div class="panel-footer">
                            <button id="confirm-selection-btn" class="btn" onclick="confirmSelection()" disabled>準備就緒</button>
                            <button class="btn-quit" onclick="location.reload()">離開房間</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="game-layer" style="display: none;">
        <div id="score-container">
            <div id="blue-score-dots" class="dots-group"></div>
            <div id="game-title">豹豹大作戰</div>
            <div id="red-score-dots" class="dots-group"></div>
        </div>

        <div id="announcement" class="big-text-overlay"></div> 

        <div id="game-container">
            <div id="ui-layer">
                <div class="stats">
                    <span id="turn-display">目前回合：藍隊 (玩家)</span>
                    <span id="instruction">請拉動豹豹進行彈射</span>
                    <span id="action-damage-text"></span>
                </div>
            </div>
            <canvas id="gameCanvas"></canvas>
        </div>
    </div>

    <div id="result-layer" style="display: none;">
        <div class="result-card">
            <div id="winner-banner" class="winner-banner">BLUE VICTORY</div>        
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">總擊殺</span>
                    <span id="final-kills" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">總造成傷害</span>
                    <span id="final-damage" class="stat-value">0</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">戰鬥輪數</span>
                    <span id="final-rounds" class="stat-value">0</span>
                </div>
            </div>

            <div class="result-buttons">
                <button class="btn restart" onclick="location.reload()">
                    <span class="btn-icon">🔄</span> 再戰一場
                </button>
                <button class="btn menu" onclick="location.reload()">
                    <span class="btn-icon">🏠</span> 回到選單
                </button>
            </div>
        </div>
    </div>

    <div id="training-ui" style="display: none; position: fixed; top: 10px; right: 10px; background: rgba(0,0,0,0.8); color: white; padding: 15px; border-radius: 10px; z-index: 3000; font-size: 14px; width: 250px;">
        <h3 style="margin-top:0; color:#ffcc00;">AI 課程訓練中...</h3>
        <div id="train-stats">
            課程等級: <span id="curr-level">1</span><br>
            訓練回合: <span id="train-episodes">0</span><br>
            目前勝率: <span id="win-rate">0%</span><br>
            累積獎勵: <span id="avg-reward">0</span>
        </div>
        <hr>
        <label><input type="checkbox" id="render-toggle" checked> 顯示畫面 (渲染)</label><br>
        <button class="btn" style="width:100%; margin-top:10px; font-size:14px; padding:5px;" onclick="saveAIModel()">💾 匯出並應用模型</button>
        <button class="btn-quit" onclick="stopTraining()">停止訓練</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="script.js"></script>
</body>
</html>
