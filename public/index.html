<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>豹豹碰碰大作戰</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="ui-layer">
            <div class="stats">
                <span id="turn-display">目前回合：藍隊 (玩家)</span>
                <span id="instruction">請點擊並拖動你的豹豹進行彈射</span>
            </div>
            <div id="score-board">
                <div class="team blue">藍隊剩餘: <span id="blue-count">3</span></div>
                <div class="team red">紅隊剩餘: <span id="red-count">3</span></div>
            </div>
        </div>
        <canvas id="gameCanvas"></canvas>
    </div>
    <script src="script.js"></script>
</body>
</html>
